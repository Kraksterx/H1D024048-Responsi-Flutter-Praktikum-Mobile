include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    use_super_parameters: ignore
    deprecated_member_use: ignore
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    use_super_parameters: false
    deprecated_member_use: false
